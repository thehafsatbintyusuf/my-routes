<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Routes - Add route</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <a href="place.html">← Cancel</a>
    <h1>Add a route</h1>
  </header>

  <main>
    <form id="route-form">

      <label for="from">From</label>
      <input type="text" id="from" placeholder="e.g. Home">

      <label for="to">To</label>
      <input type="text" id="to" placeholder="e.g. NITDA">

      <label for="version">Version</label>
      <input type="text" id="version" placeholder="e.g. Morning, before 8 a.m.">

      <section id="step-1">
        <h2>Step 1</h2>

        <label for="mode">Travel by</label>
        <select id="mode">
          <option>Bus</option>
          <option>Keke</option>
          <option>Cab</option>
          <option>Walk</option>
        </select>

        <label for="start">Where I start</label>
        <input type="text" id="start" placeholder="e.g. Opposite Kurudu">

        <label for="stop">Where I stop</label>
        <input type="text" id="stop" placeholder="e.g. Court of Appeal">

        <label for="landmarks">Landmarks I see</label>
        <input type="text" id="landmarks" placeholder="e.g. Honeysuckle, River House">

        <h3>Checkpoints I pass (in order)</h3>

        <div class="checkpoint-row">
          <input type="text" list="saved-checkpoints" placeholder="Pick or type a new one">
          <button type="button">↑</button>
          <button type="button">↓</button>
          <button type="button">−</button>
        </div>

        <div class="checkpoint-row">
          <input type="text" list="saved-checkpoints" placeholder="Pick or type a new one">
          <button type="button">↑</button>
          <button type="button">↓</button>
          <button type="button">−</button>
        </div>

        <datalist id="saved-checkpoints">
          <option value="Karu CBN Junction">
          <option value="Market Square">
          <option value="Kurudu Block Industries">
          <option value="Kurudu Market">
        </datalist>

        <button type="button" id="add-checkpoint-btn">+ Add checkpoint</button>

        <label for="fare">Fare (₦)</label>
        <input type="text" id="fare" inputmode="numeric" placeholder="e.g. 200">

        <label for="note">Note</label>
        <input type="text" id="note" placeholder="e.g. Leave before 8 a.m.">
      </section>

      <button type="button" id="add-step-btn">+ Add another step</button>
      <button type="submit" id="save-route-btn">Save route</button>

    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
