<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Routes - Add route</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <a href="place.html">← Cancel</a>
    <h1>Add a route</h1>
  </header>

  <main>
  <form id="route-form">

    <label for="from">From</label>
    <input type="text" id="from" placeholder="e.g. Home" required>

    <label for="to">To</label>
    <input type="text" id="to" placeholder="e.g. NITDA" required>

    <label for="version">Version</label>
    <input type="text" id="version" placeholder="e.g. Morning, before 8 a.m.">

    <div id="steps-container"></div>

    <button type="button" id="add-step-btn">+ Add another step</button>
    <button type="submit" id="save-route-btn">Save route</button>

  </form>

  <datalist id="saved-checkpoints"></datalist>

  <template id="step-template">
    <section class="step">
      <h2 class="step-title"></h2>

      <label>Travel by
        <select class="step-mode">
          <option>Bus</option>
          <option>Keke</option>
          <option>Cab</option>
          <option>Walk</option>
        </select>
      </label>

      <label>Where I start
        <input type="text" class="step-start">
      </label>

      <label>Where I stop
        <input type="text" class="step-stop">
      </label>

      <label>Landmarks I see
        <input type="text" class="step-landmarks">
      </label>

      <h3>Checkpoints I pass (in order)</h3>
      <div class="checkpoints"></div>
      <button type="button" class="add-checkpoint-btn">+ Add checkpoint</button>

      <label>Fare (₦)
        <input type="text" inputmode="numeric" class="step-fare">
      </label>

      <label>Note
        <input type="text" class="step-note">
      </label>

      <button type="button" class="remove-step-btn">Remove this step</button>
    </section>
  </template>
</main>

<script src="script.js"></script>
</body>
</html>
