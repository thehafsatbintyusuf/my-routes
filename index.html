<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Routes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>myRoutes<span class="tld">.NG</span></h1>
    <p>Which state are you in?</p>
  </header>

  <main>
    <div class="carousel">
  <button type="button" id="carousel-prev" class="carousel-arrow" aria-label="Previous state">‹</button>
  <ul id="states-list"></ul>
  <button type="button" id="carousel-next" class="carousel-arrow" aria-label="Next state">›</button>
</div>

    <button id="add-state-btn">+ Add state</button>
  </main>
<dialog id="state-dialog">
  <form id="state-form">
    <h2>Add a state</h2>

    <label for="state-name">State name</label>
    <input type="text" id="state-name" required>
    <label for="state-image">Picture (optional)</label>
<input type="file" id="state-image" accept="image/*">
    <p id="state-error" hidden></p>

    <button type="button" id="state-cancel">Cancel</button>
    <button type="submit">Add</button>
  </form>
</dialog>
<dialog id="edit-state-dialog">
  <form id="edit-state-form">
    <h2>Rename state</h2>

    <label for="edit-state-name">New name</label>
    <input type="text" id="edit-state-name" required>
    <label for="edit-state-image">Change picture (optional)</label>
<input type="file" id="edit-state-image" accept="image/*">
    <p id="edit-state-error" hidden></p>

    <button type="button" id="edit-state-cancel">Cancel</button>
    <button type="submit">Save</button>
  </form>
</dialog>

<dialog id="delete-state-dialog">
  <form id="delete-state-form">
    <h2 id="delete-state-title"></h2>
    <p id="delete-state-message"></p>

    <button type="button" id="delete-state-cancel">Cancel</button>
    <button type="submit">Delete</button>
  </form>
</dialog>
  <script src="script.js"></script>
</body>
</html>
