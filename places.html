<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Routes - Places</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <a href="index.html">← Change state</a>
  <h1 id="state-title"></h1>
</header>

<main>
  <input type="search" id="search" placeholder="Search places...">
  <button id="add-place-btn">+ Add place</button>

  <h2>My places</h2>
  <ul id="places-list"></ul>
</main>

<dialog id="place-dialog">
  <form id="place-form">
    <h2>Add a place</h2>

    <label for="place-name">Place name</label>
    <input type="text" id="place-name" required>
    <p id="place-error" hidden></p>

    <button type="button" id="place-cancel">Cancel</button>
    <button type="submit">Add</button>
  </form>
</dialog>

  <script src="script.js"></script>
